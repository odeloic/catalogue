<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    :root {
      --fg: #1f2328;
      --muted: #59636e;
      --bg: #ffffff;
      --panel: #f6f8fa;
      --border: #d0d7de;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3;
        --muted: #9198a1;
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --accent: #4493f8;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.55;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 1.25rem;
      letter-spacing: -0.01em;
    }
    .explanation {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.98rem;
    }
    .explanation:empty { display: none; }
    .mermaid {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      overflow-x: auto;
      font-size: 14px;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>{{TITLE}}</h1>
  <div class="explanation">{{EXPLANATION_HTML}}</div>
  <pre class="mermaid">{{DIAGRAM_SOURCE}}</pre>
  <footer>Generated by the <code>explain-codebase</code> skill.</footer>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default',
      securityLevel: 'loose'
    });
  </script>
</body>
</html>
